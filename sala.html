<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sala de Control Biocultural · KATOUWA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sala/sala.css">
</head>
<body>
  <div class="app">

    <!-- ───────── Riel izquierdo ───────── -->
    <aside class="rail">
      <a class="rail__home" href="index.html">← Inicio</a>
      <div class="rail__brand">
        <span class="rail__mark">KATOUWA</span>
        <h1>Sala de Control Biocultural</h1>
      </div>

      <div class="rail__group">
        <p class="rail__label">Territorio</p>
        <div class="seg" role="radiogroup" aria-label="Territorio" id="territorySwitch">
          <button role="radio" aria-checked="true" data-territory="santa-rosa">Santa Rosa de Agua</button>
          <button role="radio" aria-checked="false" data-territory="donana">Doñana</button>
        </div>
      </div>

      <div class="rail__group">
        <p class="rail__label">Capas</p>
        <div class="layers" role="radiogroup" aria-label="Capas" id="layerSwitch">
          <button role="radio" aria-checked="false" data-layer="nasa">
            <svg viewBox="0 0 24 24" width="18" height="18"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M3 6h5v4H3zM16 14h5v4h-5zM8 8l1 1M15 15l1 1"/></g></svg>
            Satélite NASA
          </button>
          <button role="radio" aria-checked="false" data-layer="voces">
            <svg viewBox="0 0 24 24" width="18" height="18"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 12h1M8 8v8M12 5v14M16 9v6M20 11v2"/></g></svg>
            Voces de la comunidad
          </button>
          <button role="radio" aria-checked="true" data-layer="ambos">
            <svg viewBox="0 0 24 24" width="18" height="18"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></g></svg>
            Ambos cielos
          </button>
        </div>
      </div>

      <div class="rail__group">
        <div class="rail__row">
          <p class="rail__label">Año</p>
          <output class="year" id="yearOut">2026</output>
        </div>
        <input class="slider" id="year" type="range" min="2013" max="2026" step="1" value="2026" aria-label="Año">
        <div class="slider__ends"><span>2013</span><span>2026</span></div>
      </div>

      <p class="rail__status" id="sourceStatus"></p>
    </aside>

    <!-- ───────── Centro ───────── -->
    <main class="stage">
      <div class="map" id="map">
        <svg id="mapSvg" role="img" aria-label="Mapa del área de estudio"></svg>

        <div class="legend" aria-label="Leyenda">
          <span><i class="sw sw--green"></i><b id="legendVeg">manglar</b></span>
          <span><i class="sw sw--blue"></i><b id="legendWater">lago</b></span>
          <span><i class="sw sw--coral"></i><b>zona crítica</b></span>
        </div>

        <!-- Tarjeta de zona (aparece al hacer clic) -->
        <article class="zone-card" id="zoneCard" hidden aria-live="polite">
          <header class="zone-card__head">
            <h2 id="zcTitle"></h2>
            <button class="icon-btn" id="zcClose" aria-label="Cerrar">×</button>
          </header>
          <span class="badge" id="zcBadge"></span>
          <dl class="rows" id="zcRows"></dl>
          <p class="zone-card__sub" id="zcRegionalTitle"></p>
          <dl class="rows rows--small" id="zcRegional"></dl>
          <span class="mock-tag" id="zcMock">Datos de prueba</span>
        </article>
      </div>

      <!-- Pulso del territorio -->
      <section class="pulse" id="pulse" aria-label="Pulso del territorio">
        <p class="pulse__title">Pulso del territorio</p>
        <div class="pulse__empty" id="pulseEmpty">Selecciona un punto del mapa</div>
        <div class="pulse__live" id="pulseLive" hidden>
          <button class="play" id="playBtn" aria-label="Reproducir sonificación">
            <svg viewBox="0 0 24 24" width="18" height="18" class="play__icon"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
            <svg viewBox="0 0 24 24" width="18" height="18" class="pause__icon"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
          </button>
          <div class="pulse__viz">
            <canvas id="waveCanvas"></canvas>
            <canvas id="chladniCanvas" hidden></canvas>
          </div>
          <div class="pulse__side">
            <p class="pulse__caption" id="pulseCaption"></p>
            <label class="toggle" id="chladniToggleWrap" hidden>
              <input type="checkbox" id="chladniToggle">
              <span class="toggle__track"><span class="toggle__thumb"></span></span>
              Ver como patrón Chladni
            </label>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="sala/config.js"></script>
  <script src="sala/mock-data.js"></script>
  <script src="sala/api.js"></script>
  <script src="sala/map.js"></script>
  <script src="sala/pulse.js"></script>
  <script src="sala/sala.js"></script>
</body>
</html>
